name: Img2AI Approved Issue to JSON

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  issue-to-json:
    if: |
      github.event.label.name == 'approved' &&
      contains(join(github.event.issue.labels.*.name, ' '), 'prompt-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Convert approved issue to JSON
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          APPROVED_OUTPUT_DIR: data/my/approved
        run: pnpm img2ai:issue-to-json

      - name: Generate README
        env:
          UPSTREAM_README_URL: ${{ vars.UPSTREAM_README_URL }}
          LOCAL_README_OUTPUT: README.md
        run: pnpm img2ai:generate

      - name: Commit generated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/my/approved README.md
          if git diff --quiet && git diff --staged --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "data: add approved Img2AI prompt"
          git pull --rebase origin main
          git push

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '已同步为 `data/my/approved/*.json`，并重新生成 README。现在将关闭该 Issue，后续可在已关闭 Issue 中追溯。'
            })
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              state_reason: 'completed'
            })
